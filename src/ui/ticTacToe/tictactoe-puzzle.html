<div id="tictactoe-puzzle-box">
  <div class="blood-drip blood-drip-1"></div>
  <div class="blood-drip blood-drip-2"></div>
  <div class="blood-drip blood-drip-3"></div>

  <div id="tictactoe-mirror-dialogue" class="mirror-dialogue hidden">
    <div class="dialogue-text"></div>
  </div>

  <div id="tictactoe-puzzle-header">
    <h3 class="glitch-text" data-text="MIRROR OF THE DAMNED">MIRROR OF THE DAMNED</h3>
    <p id="tictactoe-game-status">⚠ YOUR SOUL vs THE ENTITY ⚠</p>
    <p class="warning-text">Lose... and your soul is mine</p>
  </div>

  <div id="tictactoe-puzzle-board">
    <div class="mirror-crack mirror-crack-1"></div>
    <div class="mirror-crack mirror-crack-2"></div>
    <div class="mirror-crack mirror-crack-3"></div>
    <canvas id="tictactoe-puzzle-canvas"></canvas>
    <div class="ghost-overlay"></div>
  </div>

  <div id="tictactoe-puzzle-controls">
    <p id="tictactoe-turn-indicator">Your Turn</p>
    <div class="puzzle-buttons">
      <button id="tictactoe-reset-puzzle-btn">⟲ RESTART</button>
      <button id="tictactoe-close-puzzle-btn">✕ FLEE</button>
    </div>
  </div>
</div>

<div id="tictactoe-puzzle-result-overlay" class="hidden">
  <div id="tictactoe-result-message">
    <h1 id="tictactoe-result-title"></h1>
    <p id="tictactoe-result-subtitle"></p>
    <p id="tictactoe-ghost-dialogue"></p>
  </div>
</div>
